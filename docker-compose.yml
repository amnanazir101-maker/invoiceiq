# docker compose up: the REST API on :8000 and the web app on :8501.
# Both read GEMINI_API_KEY from .env.
services:
  api:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
  app:
    build: .
    env_file: [.env]
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.headless=true"]
    ports: ["8501:8501"]
