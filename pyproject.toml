[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invoiceiq"
version = "0.1.0"
description = "Document AI that turns receipt and invoice images into validated, structured data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amna Nazir" }]
keywords = ["document-ai", "information-extraction", "receipts", "invoices", "gemini", "ocr", "donut"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "google-genai>=2.30,<3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pillow>=10",
    "pypdfium2>=4.30",
    "rapidocr>=3.4",
    "onnxruntime>=1.18",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "pyarrow>=15",
    "huggingface-hub>=0.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "rich>=13",
]

[project.optional-dependencies]
app = ["streamlit>=1.40", "altair>=5"]
donut = ["torch>=2.2", "transformers>=4.40", "sentencepiece>=0.2", "protobuf>=4"]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.17.2"]  # ruff pinned so CI formats exactly like local runs
docs = ["vl-convert-python>=1.6"]  # renders docs/benchmark.png (scripts/benchmark_figure.py)

[project.urls]
Homepage = "https://github.com/amnanazir101-maker/invoiceiq"
Issues = "https://github.com/amnanazir101-maker/invoiceiq/issues"

[project.scripts]
invoiceiq = "invoiceiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]
